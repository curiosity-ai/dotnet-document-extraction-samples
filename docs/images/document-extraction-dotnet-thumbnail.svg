<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Extract documents in .NET</title>
  <desc>Extract documents in .NET. A document page turns into headings, paragraphs, tables, and images through DocumentExtractionClient.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1080" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25105D"/>
      <stop offset="0.55" stop-color="#4B23A1"/>
      <stop offset="1" stop-color="#8054D7"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="1000" y1="1080" x2="1920" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9470F1" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#C3AAFF" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#E9DEFF" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="badge" x1="96" y1="108" x2="350" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DE4F5"/>
      <stop offset="1" stop-color="#55B9F3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#180A3F" flood-opacity="0.24"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2A1660" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <path d="M780 1150C1100 650 1370 990 2020 180L2020 570C1610 1090 1360 780 1150 1150Z" fill="url(#ribbon)"/>
  <path d="M1070 1110C1340 760 1560 1020 1960 680" fill="none" stroke="#C9B6FF" stroke-opacity="0.18" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="96" y="108" width="254" height="80" rx="40" fill="url(#badge)"/>
    <text x="223" y="162" text-anchor="middle" fill="#17112C" font-size="38" font-weight="700" letter-spacing="2">.NET AI</text>
    <text x="90" y="370" fill="#FFFFFF" font-size="122" font-weight="650" letter-spacing="-3">
      <tspan x="90">Extract</tspan>
      <tspan x="90" dy="144">documents</tspan>
      <tspan x="90" dy="144">in .NET</tspan>
    </text>
    <text x="98" y="850" fill="#EEE7FF" font-size="46">
      <tspan x="98">One API.</tspan>
      <tspan x="98" dy="62">Your choice of provider.</tspan>
    </text>
  </g>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="1180" y="240" width="644" height="600" rx="48" fill="#F9F7FF"/>
    <rect x="1212" y="272" width="580" height="464" rx="24" fill="#FFFFFF" stroke="#E8E2F3" stroke-width="2"/>
  </g>

  <!-- Document page -->
  <g filter="url(#soft)">
    <path d="M1258 318H1414L1448 352V566H1258Z" fill="#FFFFFF" stroke="#D9D0EC" stroke-width="2"/>
    <path d="M1414 318V352H1448" fill="#F1ECFB" stroke="#D9D0EC" stroke-width="2"/>
  </g>
  <rect x="1278" y="342" width="104" height="14" rx="4" fill="#6B3FD4"/>
  <rect x="1278" y="372" width="148" height="7" rx="3.5" fill="#D6CDE8"/>
  <rect x="1278" y="388" width="140" height="7" rx="3.5" fill="#D6CDE8"/>
  <rect x="1278" y="404" width="116" height="7" rx="3.5" fill="#D6CDE8"/>
  <g fill="none" stroke="#B9A9DF" stroke-width="2">
    <rect x="1278" y="426" width="150" height="60" rx="3"/>
    <path d="M1278 446H1428M1278 466H1428M1328 426V486M1378 426V486"/>
  </g>
  <rect x="1279" y="427" width="148" height="18" fill="#EDE6FB"/>
  <rect x="1278" y="502" width="64" height="44" rx="4" fill="#DCEFFB"/>
  <path d="M1284 540L1300 520L1312 532L1322 524L1336 540Z" fill="#7CC4EC"/>
  <rect x="1354" y="506" width="74" height="7" rx="3.5" fill="#D6CDE8"/>
  <rect x="1354" y="522" width="66" height="7" rx="3.5" fill="#D6CDE8"/>
  <rect x="1354" y="538" width="70" height="7" rx="3.5" fill="#D6CDE8"/>

  <!-- Arrow -->
  <path d="M1472 442H1520M1506 428L1522 442L1506 456" fill="none" stroke="#79698D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Elements -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#2B1F45">
    <rect x="1546" y="322" width="212" height="52" rx="12" fill="#F4F0FD" stroke="#E2D9F6" stroke-width="2"/>
    <rect x="1546" y="322" width="10" height="52" rx="5" fill="#6B3FD4"/>
    <text x="1574" y="356">Heading</text>
    <rect x="1546" y="386" width="212" height="52" rx="12" fill="#F4F0FD" stroke="#E2D9F6" stroke-width="2"/>
    <rect x="1546" y="386" width="10" height="52" rx="5" fill="#A88BEB"/>
    <text x="1574" y="420">Paragraph</text>
    <rect x="1546" y="450" width="212" height="52" rx="12" fill="#F4F0FD" stroke="#E2D9F6" stroke-width="2"/>
    <rect x="1546" y="450" width="10" height="52" rx="5" fill="#2BB3A3"/>
    <text x="1574" y="484">Table</text>
    <rect x="1546" y="514" width="212" height="52" rx="12" fill="#F4F0FD" stroke="#E2D9F6" stroke-width="2"/>
    <rect x="1546" y="514" width="10" height="52" rx="5" fill="#55B9F3"/>
    <text x="1574" y="548">Image</text>
  </g>

  <!-- Providers -->
  <path d="M1256 600H1748" stroke="#E8E2F3" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="1502" y="638" font-size="18" fill="#79698D" letter-spacing="2">PROVIDERS INCLUDE</text>
    <text x="1502" y="680" font-size="22" font-weight="600" fill="#3E2F5C">PdfPig  ·  Vision LLMs  ·  Mistral OCR</text>
    <text x="1502" y="714" font-size="22" font-weight="600" fill="#3E2F5C">Document Intelligence  ·  Content Understanding</text>
  </g>

  <text x="1502" y="798" font-family="Cascadia Mono, Consolas, monospace" font-size="30" fill="#57466E" text-anchor="middle">DocumentExtractionClient</text>
</svg>
