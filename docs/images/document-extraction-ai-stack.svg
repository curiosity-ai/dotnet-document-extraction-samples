<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .title { font: 700 56px 'Segoe UI', sans-serif; fill: #fff; }
    .sub { font: 400 26px 'Segoe UI', sans-serif; fill: #b4a7f5; }
    .layer { font: 600 26px 'Segoe UI', sans-serif; }
    .grp { font: 600 19px 'Segoe UI', sans-serif; fill: #c9c4de; }
    .lib { font: 600 20px 'Cascadia Code', Consolas, monospace; fill: #fff; }
    .lib-dim { font: 600 20px 'Cascadia Code', Consolas, monospace; fill: #c9c4de; }
    .ns { font: 400 15px 'Cascadia Code', Consolas, monospace; fill: #9d97b8; }
    .ns-new { font: 400 15px 'Cascadia Code', Consolas, monospace; fill: #ff9fcd; }
    .new { font: 700 20px 'Cascadia Code', Consolas, monospace; fill: #ff6fb5; }
    .desc { font: 400 16px 'Segoe UI', sans-serif; fill: #a8a3bf; }
    .desc-hi { font: 400 16px 'Segoe UI', sans-serif; fill: #e4e0f5; }
    .step { font: 700 14px 'Segoe UI', sans-serif; letter-spacing: 1.5px; }
    .pill { font: 700 13px 'Segoe UI', sans-serif; fill: #1e1b2e; }
    .foot { font: 400 17px 'Segoe UI', sans-serif; fill: #a8a3bf; }
    .ph { font: 700 18px 'Segoe UI', sans-serif; fill: #b4a7f5; letter-spacing: 1px; }
    .pg { font: 700 15px 'Segoe UI', sans-serif; letter-spacing: 1px; }
    .pi { font: 400 19px 'Segoe UI', sans-serif; fill: #fff; }
    .tag { font: 400 17px 'Segoe UI', sans-serif; fill: #b4a7f5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3ddbb5"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6fb5"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#1e1b2e"/>
  <text x="75" y="92" class="title">Where document extraction fits</text>
  <text x="75" y="142" class="sub">The .NET AI stack, by library</text>

  <!-- Your app -->
  <g opacity="0.6">
    <rect x="75" y="180" width="1058" height="108" rx="14" fill="#2b2640"/>
    <rect x="75" y="180" width="6" height="108" fill="#f5b942"/>
    <text x="103" y="243" class="layer" fill="#f5b942">Your app</text>
    <text x="320" y="216" class="grp">Web</text>
    <text x="320" y="244" class="desc">ASP.NET Core · Blazor</text>
    <text x="560" y="216" class="grp">Desktop + mobile</text>
    <text x="560" y="244" class="desc">Windows: WinUI · WPF · Windows Forms</text>
    <text x="560" y="268" class="desc">Cross-platform: .NET MAUI</text>
    <text x="880" y="216" class="grp">Services</text>
    <text x="880" y="244" class="desc">Aspire · worker services</text>
    <text x="880" y="268" class="desc">console apps</text>
  </g>

  <!-- Agents + tools -->
  <g opacity="0.6">
    <rect x="75" y="300" width="1058" height="96" rx="14" fill="#2b2640"/>
    <rect x="75" y="300" width="6" height="96" fill="#f5b942"/>
    <text x="103" y="357" class="layer" fill="#f5b942">Agents + tools</text>
    <text x="320" y="342" class="lib-dim">Microsoft.Agents.AI</text>
    <text x="320" y="370" class="desc">Microsoft Agent Framework: agents and workflows</text>
    <text x="760" y="342" class="lib-dim">ModelContextProtocol</text>
    <text x="760" y="370" class="desc">MCP C# SDK: connect tools and data</text>
  </g>

  <!-- Context (highlighted) -->
  <rect x="75" y="408" width="1058" height="222" rx="14" fill="#33294d" stroke="#3ddbb5" stroke-width="2"/>
  <rect x="75" y="408" width="6" height="222" fill="#3ddbb5"/>
  <text x="103" y="458" class="layer" fill="#3ddbb5">Context</text>
  <text x="103" y="486" class="desc">Get your data</text>
  <text x="103" y="508" class="desc">ready for AI</text>

  <!-- Read (new) -->
  <rect x="306" y="426" width="262" height="186" rx="12" fill="#3a2244" stroke="#ff6fb5" stroke-width="2"/>
  <text x="326" y="456" class="step" fill="#ff6fb5">1 · READ</text>
  <rect x="486" y="439" width="62" height="24" rx="12" fill="#ff6fb5"/>
  <text x="517" y="456" class="pill" text-anchor="middle">NEW</text>
  <text x="326" y="492" class="ns-new">Microsoft.Extensions.</text>
  <text x="326" y="518" class="new">DocumentExtraction</text>
  <text x="326" y="550" class="desc-hi">PDFs, images, Office files,</text>
  <text x="326" y="572" class="desc-hi">and more in. Sections, tables,</text>
  <text x="326" y="594" class="desc-hi">and figures out.</text>

  <line x1="572" y1="519" x2="604" y2="519" stroke="#3ddbb5" stroke-width="3" marker-end="url(#a)"/>

  <!-- Chunk -->
  <rect x="610" y="426" width="240" height="186" rx="12" fill="#2b2640"/>
  <text x="630" y="456" class="step" fill="#3ddbb5">2 · CHUNK + ENRICH</text>
  <text x="630" y="492" class="ns">Microsoft.Extensions.</text>
  <text x="630" y="518" class="lib">DataIngestion</text>
  <text x="630" y="550" class="desc-hi">Splits documents into</text>
  <text x="630" y="572" class="desc-hi">chunks and writes them</text>

  <line x1="854" y1="519" x2="886" y2="519" stroke="#3ddbb5" stroke-width="3" marker-end="url(#a)"/>

  <!-- Store -->
  <rect x="892" y="426" width="222" height="186" rx="12" fill="#2b2640"/>
  <text x="912" y="456" class="step" fill="#3ddbb5">3 · STORE + SEARCH</text>
  <text x="912" y="492" class="ns">Microsoft.Extensions.</text>
  <text x="912" y="518" class="lib">VectorData</text>
  <text x="912" y="550" class="desc-hi">One API over vector</text>
  <text x="912" y="572" class="desc-hi">databases</text>

  <!-- Models -->
  <g opacity="0.6">
    <rect x="75" y="642" width="1058" height="118" rx="14" fill="#2b2640"/>
    <rect x="75" y="642" width="6" height="118" fill="#5b8cff"/>
    <text x="103" y="694" class="layer" fill="#5b8cff">Models</text>
    <text x="103" y="722" class="desc">Text, vision, audio</text>
    <text x="103" y="744" class="desc">Local or hosted</text>
    <text x="320" y="684" class="lib-dim">Microsoft.Extensions.AI</text>
    <text x="320" y="712" class="desc">IChatClient · IEmbeddingGenerator · speech · images</text>
    <text x="320" y="736" class="desc">One way to call any model, with middleware</text>
    <text x="840" y="684" class="grp" style="font-size:20px">Model providers</text>
    <text x="840" y="712" class="desc">OpenAI · Microsoft Foundry · Anthropic</text>
    <text x="840" y="736" class="desc">Ollama · ONNX Runtime · and more</text>
  </g>

  <text x="103" y="800" class="foot">Built on core .NET: System.Numerics.Tensors · Microsoft.ML.Tokenizers</text>

  <!-- Providers panel -->
  <rect x="1167" y="180" width="358" height="640" rx="16" fill="#2b2640" stroke="#ff6fb5" stroke-opacity="0.45" stroke-width="2"/>
  <text x="1191" y="220" class="ph">DOCUMENT EXTRACTION</text>
  <text x="1191" y="244" class="ph">PROVIDERS</text>

  <text x="1191" y="290" class="pg" fill="#3ddbb5">IN PROCESS</text>
  <text x="1191" y="320" class="pi">PdfPig</text>
  <text x="1191" y="344" class="desc">PDFs with a text layer</text>

  <text x="1191" y="390" class="pg" fill="#b4a7f5">ANY ICHATCLIENT</text>
  <text x="1191" y="420" class="pi">Vision language model</text>
  <text x="1191" y="444" class="desc">local, like Ollama, or hosted</text>

  <text x="1191" y="490" class="pg" fill="#5b8cff">HOSTED SERVICES</text>
  <text x="1191" y="520" class="pi">Azure Content Understanding</text>
  <text x="1191" y="548" class="pi">Azure Document Intelligence</text>
  <text x="1191" y="576" class="pi">Mistral OCR</text>
  <text x="1191" y="600" class="desc">Microsoft Foundry or Mistral API</text>

  <text x="1191" y="646" class="pg" fill="#f5b942">YOUR OWN</text>
  <text x="1191" y="676" class="pi">Build a provider</text>
  <text x="1191" y="700" class="desc">derive from DocumentExtractionClient</text>

  <text x="1191" y="766" class="tag">Same contract.</text>
  <text x="1191" y="792" class="tag">Your choice of provider.</text>

  <!-- connector from READ to providers -->
  <path d="M437,614 L437,636 L1160,636" fill="none" stroke="#ff6fb5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ap)"/>

  <text x="75" y="868" class="desc">.NET AI STACK / CONTEXT</text>
</svg>
