<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <text x="400" y="50" font-size="26" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Matrix multiply: [2, 3] × [3, 2] = [2, 2]</text>

  <g font-size="22" font-weight="bold" fill="#512BD4" text-anchor="middle">
    <text x="105" y="125">A  [2, 3]</text>
    <text x="290" y="125">B  [3, 2]</text>
    <text x="460" y="125">C  [2, 2]</text>
  </g>

  <!-- Highlights: row 1 of A, column 1 of B, cell C[1,1] -->
  <rect x="30" y="170" width="150" height="50" fill="#E8E1FA"/>
  <rect x="240" y="145" width="50" height="150" fill="#E8E1FA"/>
  <rect x="400" y="160" width="60" height="60" fill="#E8E1FA"/>

  <!-- Matrix A -->
  <g stroke="#512BD4" stroke-width="2" fill="none">
    <rect x="30" y="170" width="150" height="100"/>
    <line x1="80" y1="170" x2="80" y2="270"/>
    <line x1="130" y1="170" x2="130" y2="270"/>
    <line x1="30" y1="220" x2="180" y2="220"/>
  </g>
  <!-- Matrix B -->
  <g stroke="#512BD4" stroke-width="2" fill="none">
    <rect x="240" y="145" width="100" height="150"/>
    <line x1="290" y1="145" x2="290" y2="295"/>
    <line x1="240" y1="195" x2="340" y2="195"/>
    <line x1="240" y1="245" x2="340" y2="245"/>
  </g>
  <!-- Matrix C -->
  <g stroke="#512BD4" stroke-width="2" fill="none">
    <rect x="400" y="160" width="120" height="120"/>
    <line x1="460" y1="160" x2="460" y2="280"/>
    <line x1="400" y1="220" x2="520" y2="220"/>
  </g>

  <g font-size="34" fill="#1b1b1b" text-anchor="middle">
    <text x="210" y="232">×</text>
    <text x="370" y="232">=</text>
  </g>

  <g font-size="22" fill="#1b1b1b" text-anchor="middle">
    <text x="55" y="203">1</text>
    <text x="105" y="203">2</text>
    <text x="155" y="203">3</text>
    <text x="55" y="253">4</text>
    <text x="105" y="253">5</text>
    <text x="155" y="253">6</text>

    <text x="265" y="178">7</text>
    <text x="315" y="178">8</text>
    <text x="265" y="228">9</text>
    <text x="315" y="228">10</text>
    <text x="265" y="278">11</text>
    <text x="315" y="278">12</text>

    <text x="430" y="198" font-weight="bold" fill="#512BD4">58</text>
    <text x="490" y="198">64</text>
    <text x="430" y="258">139</text>
    <text x="490" y="258">154</text>
  </g>

  <g font-size="20" fill="#1b1b1b">
    <text x="550" y="160">Row 1 of A</text>
    <text x="550" y="190">· column 1 of B</text>
    <text x="550" y="230">1×7 + 2×9 + 3×11</text>
    <text x="550" y="262">= 7 + 18 + 33</text>
    <text x="550" y="294" font-weight="bold" fill="#512BD4">= 58</text>
  </g>

  <line x1="30" y1="335" x2="770" y2="335" stroke="#0F6CBD" stroke-width="1"/>

  <g font-size="20" fill="#0F6CBD" text-anchor="middle">
    <text x="400" y="375">Each cell of C is the dot product of a row of A and a column of B.</text>
    <text x="400" y="410">C = [[58, 64], [139, 154]]</text>
  </g>
</svg>
