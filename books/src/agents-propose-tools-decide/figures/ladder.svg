  <text x="190" y="76" font-size="22" font-weight="700" fill="#ffffff">6. Human review</text>
  <text x="610" y="76" font-size="18" text-anchor="end" fill="#ffffff">You decide</text>
  <line x1="725" y1="400" x2="725" y2="60" stroke="#0F6CBD" stroke-width="4" marker-end="url(#up)"/>
  <text x="725" y="430" font-size="18" text-anchor="middle" fill="#1b1b1b">Cheap</text>
  <text x="725" y="40" font-size="18" text-anchor="middle" fill="#1b1b1b">Costly</text>
  <text x="75" y="236" font-size="20" font-weight="700" text-anchor="middle" fill="#512BD4">Climb</text>
  <text x="75" y="262" font-size="20" font-weight="700" text-anchor="middle" fill="#512BD4">up</text>
