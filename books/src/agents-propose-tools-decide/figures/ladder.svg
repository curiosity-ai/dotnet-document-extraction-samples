<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>
  <defs><marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6CBD"/></marker></defs>
  <line x1="150" y1="20" x2="150" y2="440" stroke="#512BD4" stroke-width="8" stroke-linecap="round"/>
  <line x1="650" y1="20" x2="650" y2="440" stroke="#512BD4" stroke-width="8" stroke-linecap="round"/>
  <rect x="170" y="382" width="460" height="52" rx="8" fill="#ffffff" stroke="#512BD4" stroke-width="3"/>
  <text x="190" y="416" font-size="22" font-weight="700" fill="#1b1b1b">1. Compiles</text>
  <text x="610" y="416" font-size="18" text-anchor="end" fill="#0F6CBD">C# compiler</text>
  <rect x="170" y="314" width="460" height="52" rx="8" fill="#ffffff" stroke="#512BD4" stroke-width="3"/>
  <text x="190" y="348" font-size="22" font-weight="700" fill="#1b1b1b">2. Analyzers clean</text>
  <text x="610" y="348" font-size="18" text-anchor="end" fill="#0F6CBD">Code analysis</text>
  <rect x="170" y="246" width="460" height="52" rx="8" fill="#ffffff" stroke="#512BD4" stroke-width="3"/>
  <text x="190" y="280" font-size="22" font-weight="700" fill="#1b1b1b">3. Tests pass</text>
  <text x="610" y="280" font-size="18" text-anchor="end" fill="#0F6CBD">xUnit or MSTest</text>
  <rect x="170" y="178" width="460" height="52" rx="8" fill="#ffffff" stroke="#512BD4" stroke-width="3"/>
  <text x="190" y="212" font-size="22" font-weight="700" fill="#1b1b1b">4. Properties hold</text>
  <text x="610" y="212" font-size="18" text-anchor="end" fill="#0F6CBD">CsCheck</text>
  <rect x="170" y="110" width="460" height="52" rx="8" fill="#ffffff" stroke="#512BD4" stroke-width="3"/>
  <text x="190" y="144" font-size="22" font-weight="700" fill="#1b1b1b">5. Allocation budget</text>
  <text x="610" y="144" font-size="18" text-anchor="end" fill="#0F6CBD">BenchmarkDotNet</text>
