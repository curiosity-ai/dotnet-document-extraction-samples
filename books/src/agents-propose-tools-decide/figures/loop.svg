<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F6CBD"/></marker>
  </defs>
  <text x="400" y="36" font-size="24" font-weight="700" text-anchor="middle" fill="#1b1b1b">The agent loop</text>
  <rect x="20" y="160" width="170" height="90" rx="10" fill="#512BD4"/>
  <text x="105" y="198" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">Agent</text>
  <text x="105" y="226" font-size="18" text-anchor="middle" fill="#ffffff">proposes diff</text>
  <rect x="220" y="160" width="170" height="90" rx="10" fill="#ffffff" stroke="#512BD4" stroke-width="3"/>
  <text x="305" y="198" font-size="20" font-weight="700" text-anchor="middle" fill="#1b1b1b">Build +</text>
  <text x="305" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="#1b1b1b">analyzers</text>
  <rect x="420" y="160" width="170" height="90" rx="10" fill="#ffffff" stroke="#512BD4" stroke-width="3"/>
  <text x="505" y="198" font-size="20" font-weight="700" text-anchor="middle" fill="#1b1b1b">Tests +</text>
  <text x="505" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="#1b1b1b">properties</text>
  <rect x="620" y="160" width="160" height="90" rx="10" fill="#ffffff" stroke="#512BD4" stroke-width="3"/>
  <text x="700" y="198" font-size="20" font-weight="700" text-anchor="middle" fill="#1b1b1b">Gate</text>
  <text x="700" y="226" font-size="20" font-weight="700" text-anchor="middle" fill="#1b1b1b">decision</text>
  <line x1="190" y1="205" x2="218" y2="205" stroke="#1b1b1b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="390" y1="205" x2="418" y2="205" stroke="#1b1b1b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="590" y1="205" x2="618" y2="205" stroke="#1b1b1b" stroke-width="3" marker-end="url(#a)"/>
  <path d="M700,160 L700,100 L105,100 L105,158" fill="none" stroke="#0F6CBD" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#r)"/>
  <text x="400" y="88" font-size="20" font-weight="700" text-anchor="middle" fill="#0F6CBD">Reject: tool output goes back as feedback</text>
  <line x1="700" y1="250" x2="700" y2="318" stroke="#1b1b1b" stroke-width="3" marker-end="url(#a)"/>
  <text x="712" y="292" font-size="18" fill="#1b1b1b">Accept</text>
  <rect x="440" y="320" width="340" height="90" rx="10" fill="#512BD4"/>
  <text x="610" y="358" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">Human review</text>
  <text x="610" y="386" font-size="18" text-anchor="middle" fill="#ffffff">reads the evidence, merges</text>
  <text x="20" y="350" font-size="18" fill="#1b1b1b">Every gate gives a yes or no.</text>
  <text x="20" y="378" font-size="18" fill="#1b1b1b">Only tool output can block a merge.</text>
</svg>
